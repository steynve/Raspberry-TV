<time class="time">{{ time() }}</time>

<div class="music" [class.cover-tinted]="coverColor()" [style.--cover-color]="coverColor()">
    @if (cover()) {
        <img
            class="cover"
            [class.paused]="!playing()"
            [src]="cover()"
            crossorigin="anonymous"
            alt=""
        />
    } @else {
        <app-icon name="audio-lines" class="playing-icon" [class.active]="playing()" />
    }
    <div>
        @if (song()) {
            <p class="song">{{ song() }}</p>
            <p class="meta">
                {{ artist() }} · <span class="station-name" [innerHTML]="station()"></span>
            </p>
        } @else {
            <p class="song station-name" [innerHTML]="station()"></p>
        }
    </div>
</div>

@if (weather(); as weather) {
    <p class="meta weather"><app-icon [name]="weather.icon" /> {{ weather.text }}</p>
}
