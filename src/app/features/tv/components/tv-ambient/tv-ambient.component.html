<time class="time">{{ time() }}</time>

<div
    class="music"
    [class.cover-tinted]="radio.coverColor()"
    [style.--cover-color]="radio.coverColor()"
>
    @if (radio.cover()) {
        <img
            class="cover"
            [class.paused]="!radio.isPlaying()"
            [src]="radio.cover()"
            crossorigin="anonymous"
            alt=""
        />
    } @else {
        <app-icon name="audio-lines" class="playing-icon" [class.active]="radio.isPlaying()" />
    }
    <div>
        @if (radio.song()) {
            <p class="song">{{ radio.song() }}</p>
            <p class="meta">
                {{ radio.artist() }} ·
                <span class="station-name" [innerHTML]="radio.channel().visibleName"></span>
            </p>
        } @else {
            <p class="song station-name" [innerHTML]="radio.channel().visibleName"></p>
        }
    </div>
</div>

@if (weather(); as weather) {
    <p class="meta weather"><app-icon [name]="weather.icon" /> {{ weather.text }}</p>
}

<!-- The bins, also on the idle screen: it's often what's on in the evening -->
<app-tv-waste />
