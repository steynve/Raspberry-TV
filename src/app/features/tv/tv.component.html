<app-tv-wallpaper [idle]="idle()">
    <main class="tv" [class.overlay]="overlay()" [class.idle]="idle()">
        <div class="tv-clock">
            <app-tv-clock />
            <app-tv-sky />
            <app-tv-waste />
        </div>
        <div class="tv-radio">
            <app-tv-now-playing />
            <app-tv-pi-alert />
        </div>
        <app-tv-weather class="tv-weather" />
        <app-tv-channels [open]="overlay()" (closed)="overlay.set(false)" />
        <app-tv-ambient [visible]="idle()" />
    </main>
</app-tv-wallpaper>
