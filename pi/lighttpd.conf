# The TV app's extras: cache headers, live files and controls.
# Installed in /etc/lighttpd/conf-enabled/ by setup.sh.
server.modules += ( "mod_setenv", "mod_cgi" )

# Live files the Pi writes in RAM (health.json), see tmpfiles.conf
alias.url += ( "/live/" => "/run/raspberry/", "/control/" => "/usr/local/lib/raspberry/control/" )

# Controls run as scripts, and only for the browser on the Pi itself
$HTTP["url"] =~ "^/control/" {
    cgi.assign = ( "" => "" )

    $HTTP["remoteip"] !~ "^(127\.0\.0\.1|::1)$" {
        url.access-deny = ( "" )
    }
}

# Built files have a hash in their name, so they never change
$HTTP["url"] =~ "\.(js|css|woff2)$" {
    setenv.add-response-header = ( "Cache-Control" => "public, max-age=31536000, immutable" )
}

# The page itself and the live files must always be fresh
$HTTP["url"] =~ "^/(index\.html)?$|^/live/" {
    setenv.add-response-header = ( "Cache-Control" => "no-cache" )
}
