# Live files for the TV app, in RAM: they change every minute, so they'd only wear out the disk.
# health.json (root, via cron), served as /live/ by lighttpd.
# Installed as /etc/tmpfiles.d/raspberry.conf by setup.sh.
d /run/raspberry 0755 pipi pipi -
# Commands for cec-client (see bash_profile), which the web server may write to: see control-tv-on
p /run/raspberry/cec 0620 pipi www-data -
z /run/raspberry/cec 0620 pipi www-data -
