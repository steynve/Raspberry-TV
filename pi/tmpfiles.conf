# Live files for the TV app, in RAM: they change every minute, so they'd only wear out the SD card.
# health.json (root, via cron) and spotify.json (pipi, via spotifyd). Served as /live/ by lighttpd.
# Installed as /etc/tmpfiles.d/raspberry.conf by setup.sh.
d /run/raspberry 0755 pipi pipi -
# Commands for cec-client, see bash_profile
p /run/raspberry/cec 0600 pipi pipi -
