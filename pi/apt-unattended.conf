// Security updates from Debian, every night, without asking (the timers run around 6:00). Raspberry
// Pi's own packages (Chromium, the kernel, libcec) only change with a deploy, see deploy.sh, so
// nothing on the TV changes unexpectedly. Installed in /etc/apt/apt.conf.d/ by setup.sh.
APT::Periodic::Update-Package-Lists "1";
APT::Periodic::Unattended-Upgrade "1";

#clear Unattended-Upgrade::Origins-Pattern;
Unattended-Upgrade::Origins-Pattern {
    "origin=Debian,codename=${distro_codename}-security,label=Debian-Security";
};
